name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract the corrected Android project
      - name: Extract Android project
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          if [ ! -f "JEE-Custom-Notify-REVISION-SYNC-PERFECT-REPO-FIXED.zip" ]; then
            echo "ERROR: Corrected ZIP was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          unzip -q \
            "JEE-Custom-Notify-REVISION-SYNC-PERFECT-REPO-FIXED.zip" \
            -d android-project

          echo "Project extracted successfully."

          find android-project -maxdepth 3 -type f | sort | head -150

      # 3. Automatically find the Android project root
      - name: Find Android project
        run: |
          set -e

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            find android-project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 5. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 6. Make Gradle executable
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      # 7. Check Android project
      - name: Check Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "App directory:"
          if [ -d "app" ]; then
            find app -maxdepth 3 -type f | sort | head -150
          else
            echo "ERROR: app directory not found"
            exit 1
          fi

      # 8. Build the APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # 9. Locate generated APK
      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      # 10. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notify-Revision-Sync-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
